<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PropertyLens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232447d5' stroke-width='2.4'%3E%3Ccircle cx='10.5' cy='10.5' r='6.5'/%3E%3Cpath d='M15.5 15.5L21 21' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: fixed app header, then route views. Portfolio = map-dominant grid with queue rail; workspace = 25/45/30 columns. Single light theme by design (financial ops tool). */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#f8fafa; --ink:#12263a; --ink-2:#44586b; --ink-3:#6a7b8b;
  --line:#d9e1e6; --line-2:#e9eef1;
  --teal:#2447d5; --teal-hover:#0b5f58; --teal-soft:#e1f1ee; --teal-line:#a8d5ce;
  --amber:#965a06; --amber-soft:#fcf1dc; --amber-line:#ecd09a;
  --red:#b42318; --red-soft:#fbeae8; --red-line:#f0c1bb;
  --slate:#3d5f87; --slate-soft:#e8eef6; --slate-line:#c3d2e4;
  --green:#2a7653; --green-soft:#e4f1e9; --green-line:#b9dbc8;
  --gray:#667381; --gray-soft:#eef0f2;
  --paper:#fffef9;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.hatch{background-color:#f0f2f3;background-image:repeating-linear-gradient(45deg,#cfd5da 0 1.5px,transparent 1.5px 6px)}

/* ---------- header ---------- */
.app{display:flex;flex-direction:column;height:100%}
.top{flex:none;height:56px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink);background:none;border:0;padding:0}
.brand svg{color:var(--teal)}
.nav{display:flex;gap:2px;height:100%}
.nav button{white-space:nowrap;background:none;border:0;padding:0 11px;height:100%;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--teal)}
.nav .count{font-size:11px;background:var(--amber-soft);color:var(--amber);border-radius:4px;padding:0 6px;font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-tag{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2);border:1px dashed #a9b4be;border-radius:4px;padding:4px 9px;background-color:#f6f7f8;background-image:repeating-linear-gradient(45deg,rgba(160,172,184,.18) 0 1.5px,transparent 1.5px 7px);white-space:nowrap}
.user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--slate-soft);color:var(--slate);display:grid;place-items:center;font-weight:600;font-size:11px}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#b9c5ce;background:var(--surface-2)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-hover);border-color:var(--teal-hover)}
.btn-primary:disabled{background:#9fbfbb;border-color:#9fbfbb;cursor:not-allowed}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--gray-soft);border-color:transparent}
.btn-warn{color:var(--red);border-color:var(--red-line)}
.btn-warn:hover{background:var(--red-soft);border-color:var(--red-line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:32px;padding:0 11px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.4}
.s-needs{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.s-awaiting{color:var(--slate);background:var(--slate-soft);border-color:var(--slate-line)}
.s-referred{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.s-reviewed{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px 1px 5px;border-radius:4px;border:1px solid;white-space:nowrap;letter-spacing:.01em}
.st-sourced{color:var(--teal-hover);background:var(--teal-soft);border-color:var(--teal-line)}
.st-conflicting{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.st-estimated{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.st-missing{color:var(--gray);border-color:#c7ced5;background-color:#f0f2f3;background-image:repeating-linear-gradient(45deg,rgba(150,160,170,.25) 0 1.5px,transparent 1.5px 5px)}
.st-reviewedval{color:var(--slate);background:var(--slate-soft);border-color:var(--slate-line)}
.o-satisfied{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.o-needs{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.o-exception{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.o-referred{color:var(--slate);background:var(--slate-soft);border-color:var(--slate-line)}
.o-na{color:var(--gray);background:var(--gray-soft);border-color:#d3d9de}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.synthetic{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5d6a77;border:1px dashed #9aa7b3;border-radius:3px;padding:0 5px;background:#f7f8f9}

/* ---------- views ---------- */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.toolbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{position:relative;width:340px;max-width:100%}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px 0 32px;background:var(--surface-2)}
.search input:focus{background:#fff;border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.search .ic{position:absolute;left:10px;top:9px;color:var(--ink-3)}
.sugg{position:absolute;top:38px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 30px rgba(18,38,58,.14);z-index:40;padding:4px;max-height:320px;overflow:auto}
.sugg button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:4px}
.sugg button:hover,.sugg button.hi{background:var(--teal-soft)}
.sugg .nomatch{padding:8px 10px 4px;font-size:12px;color:var(--ink-3)}
select.sel{height:34px;border:1px solid var(--line);border-radius:4px;padding:0 28px 0 10px;background:#fff;font-size:13px}
.flabel{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.spacer{flex:1}

.port{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.queue{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.queue-h{padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.queue-h h2{font-size:15px}
.queue-counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.queue-list{overflow:auto;flex:1;padding:8px}
.qi{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line-2);border-radius:4px;padding:11px 12px;margin-bottom:8px;position:relative}
.qi:hover{border-color:#bcc8d1}
.qi.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.qi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.qi-name{font-weight:600;font-size:14px}
.qi-issue{margin-top:5px;font-size:13px;color:var(--ink);display:flex;gap:6px}
.qi-issue .ic{color:var(--amber);margin-top:1px}
.qi-meta{margin-top:7px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;color:var(--ink-2)}
.qi-meta dt{color:var(--ink-3)}
.qi-meta dd{margin:0}
.qi-actions{margin-top:10px;display:flex;gap:6px}

/* ---------- map ---------- */
.map{position:relative;min-height:0;min-width:0;background:#e6edf2;overflow:hidden}
.map-canvas{position:absolute;inset:0;touch-action:none;cursor:grab}
.map-canvas:active{cursor:grabbing}
.map-canvas svg{display:block}
.map svg text{font-family:var(--font)}
.mk{cursor:pointer}
.mctl{position:absolute;z-index:5}
.panel{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 10px rgba(18,38,58,.08)}
.layer-ctl{top:12px;left:12px;padding:8px}
.layer-ctl .eyebrow{padding:0 4px 6px;display:flex;align-items:center;gap:6px}
.layer-ctl label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;font-size:13px;cursor:pointer}
.layer-ctl label:hover{background:var(--surface-2)}
.layer-ctl label.on{background:var(--teal-soft);font-weight:600}
.layer-ctl input{accent-color:var(--teal);margin:0}
.zoom-ctl{top:12px;right:12px;display:flex;flex-direction:column;overflow:hidden}
.zoom-ctl button{width:34px;height:34px;border:0;background:#fff;display:grid;place-items:center;color:var(--ink)}
.zoom-ctl button+button{border-top:1px solid var(--line)}
.zoom-ctl button:hover{background:var(--surface-2)}
.legend{left:12px;bottom:12px;width:320px;max-width:calc(100% - 24px);padding:10px 12px}
#map-workspace .legend{width:280px;bottom:auto;top:auto;bottom:12px}
#map-workspace .scale-chip{max-width:calc(100% - 320px)}
.legend h4{font-size:13px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.legend .measure{font-size:12px;color:var(--ink-2);margin-top:1px}
.lg-rows{margin:8px 0;display:grid;gap:4px}
.lg-row{display:flex;align-items:center;gap:8px;font-size:12px}
.sw{width:22px;height:13px;border-radius:2px;border:1px solid rgba(18,38,58,.18);flex:none}
.lg-meta{border-top:1px solid var(--line-2);padding-top:7px;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:11.5px;color:var(--ink-2)}
.lg-meta dt{color:var(--ink-3)}
.lg-meta dd{margin:0}
.lg-note{margin-top:7px;font-size:11.5px;color:var(--amber);display:flex;gap:5px}
.scale-chip{right:12px;bottom:12px;padding:7px 10px;font-size:12px;max-width:340px}
.map-bottom{left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.map-bottom>.mctl{position:static;pointer-events:auto;flex:0 1 auto;min-width:0}
.map-bottom>.legend{flex:0 0 auto;max-width:60%}
.scale-chip b{font-weight:600}
.agg{top:12px;left:50%;transform:translateX(-50%);padding:10px 14px;width:min(440px,calc(100% - 340px));min-width:260px}
.zoom-note{top:12px;left:50%;transform:translateX(-50%);padding:7px 12px;font-size:12px;display:flex;gap:7px;align-items:center;max-width:min(460px,calc(100% - 330px));color:var(--ink-2)}
.loc-chip{top:12px;left:12px;padding:8px 10px;font-size:12px;max-width:290px}
.mk-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* ---------- list ---------- */
.tbl-wrap{overflow:auto;flex:1;min-height:0;padding:16px 20px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl th:first-child{border-top-left-radius:8px}.tbl th:last-child{border-top-right-radius:8px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#f7fbfa}
.tbl tr.on td{background:var(--teal-soft)}
.tbl .r{text-align:right}

/* ---------- workspace ---------- */
.ws-head{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.crumb button{border:0;background:none;padding:0;color:var(--teal);font-weight:500}
.ws-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ws-title h1{font-size:19px;letter-spacing:-.01em}
.ws-meta{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.ws{flex:1;min-height:0;display:grid;grid-template-columns:25% 45% 30%}
.ws.expanded{grid-template-columns:0 100% 0}
.ws.expanded .col-l,.ws.expanded .col-r{display:none}
.col{min-height:0;min-width:0;overflow:auto}
.col-l{background:var(--surface);border-right:1px solid var(--line);padding:14px 14px 30px}
.col-r{background:var(--surface);border-left:1px solid var(--line);padding:16px 18px 30px}
.col-m{position:relative;display:flex;flex-direction:column}
.col-m .map{flex:1}
.sec{margin-top:16px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.docs{display:grid;gap:5px}
.doc{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface-2);font-size:12px}
.doc .ic{color:var(--ink-3)}
.doc b{font-weight:600;font-size:12.5px;display:block;word-break:break-all}
.fact{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 8px;border-radius:4px;border-bottom:1px solid var(--line-2)}
.fact:hover{background:#f6faf9}
.fact-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fact-k{font-size:12px;color:var(--ink-2)}
.fact-v{font-size:14.5px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.fact-meta{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.fact-note{font-size:11.5px;margin-top:3px;color:var(--amber);display:flex;gap:4px}
.fact-note.neutral{color:var(--ink-2)}
.status-key{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:8px 9px;display:grid;gap:4px}
.missing-list{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.missing-list li{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;padding:6px 8px;border-radius:4px}
.missing-list li.hatch{border:1px solid #d5dbe0}

.ai-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ai-h h2{font-size:15px}
.ai-badge{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.ai-sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.ai-sec:first-of-type{border-top:0;padding-top:0}
.ai-sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;display:flex;gap:7px;align-items:center}
.ai-sec h3 .n{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10.5px;letter-spacing:0}
.headline{font-size:17px;font-weight:600;line-height:1.3;margin-bottom:8px}
.ai-p{font-size:13.5px;line-height:1.6;margin-bottom:8px}
.cite{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--teal-line);background:var(--teal-soft);color:var(--teal-hover);font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;vertical-align:1px;line-height:1.55}
.cite:hover{background:#cfe9e4}
.find{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.find:hover{border-color:#b7c4cd}
.find .ic{margin-top:2px}
.find .t{flex:1;min-width:0}
.ev-list{display:grid;gap:5px;font-size:12.5px}
.ev-item{display:flex;gap:8px;align-items:flex-start}
.unknown{display:grid;gap:5px;margin:0;padding:0;list-style:none;font-size:12.5px}
.unknown li{padding:6px 8px;border-radius:4px;border:1px solid #d5dbe0}
.next-box{background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:4px;padding:10px 12px;font-size:13.5px}
.req-box{margin-top:8px;border:1px solid var(--slate-line);background:var(--slate-soft);border-radius:4px;padding:9px 11px;font-size:12.5px;color:var(--ink)}
.ai-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ai-foot{margin-top:16px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:10px}
.expand-bar{position:absolute;top:12px;right:56px;z-index:6}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,38,58,.35);z-index:50;display:flex;justify-content:flex-end}
.scrim[hidden]{display:none!important}
.drawer{width:min(1020px,94vw);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(18,38,58,.18);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer,.modal{animation:none}}
.dr-h{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:flex-start;gap:12px}
.dr-h h2{font-size:18px}
.dr-b{flex:1;overflow:auto;padding:18px 20px 30px}
.dr-f{flex:none;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.paper{background:var(--paper);border:1px solid #ddd8c8;border-radius:4px;box-shadow:0 1px 0 #e9e4d4,0 6px 18px rgba(60,50,20,.07);overflow:hidden}
.paper-h{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:#f7f4ea;border-bottom:1px solid #e6e0cd;font-size:12px}
.paper-h b{font-family:var(--mono);font-weight:500;font-size:12px;word-break:break-all}
.paper-b{padding:14px 16px 16px;font-family:var(--serif);font-size:14px;line-height:1.65;color:#2a2a26}
.paper-b .ln{height:7px;background:#ebe6d6;border-radius:2px;margin:9px 0}
.paper-b mark{background:#fde58a;padding:1px 2px;border-radius:2px;box-shadow:0 0 0 1.5px #e8c547;color:#1e1e1a}
.paper-b .pg{font-family:var(--mono);font-size:11px;color:#8b8570;text-align:right;margin-top:10px}
.pr-card{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pr-card .h{padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:8px;font-size:12.5px;flex-wrap:wrap}
.pr-card table{width:100%;border-collapse:collapse;font-size:13px}
.pr-card td{padding:7px 12px;border-bottom:1px solid var(--line-2)}
.pr-card td:first-child{color:var(--ink-3);width:44%}
.pr-card .note{padding:9px 12px;font-size:12.5px;color:var(--amber);display:flex;gap:6px;background:#fffaf0}
.callout{border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:4px;padding:11px 13px;font-size:13.5px;display:flex;gap:9px;margin:14px 0}
.callout.info{border-color:var(--slate-line);background:var(--slate-soft)}
.callout.teal{border-color:var(--teal-line);background:var(--teal-soft)}
.calc{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;font-size:13.5px}
.calc-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-variant-numeric:tabular-nums}
.calc-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:#fff;width:100%}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.field .req{color:var(--red)}
.chips-in{display:flex;gap:6px;flex-wrap:wrap}
.chips-in button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.chips-in button:hover{border-color:var(--teal);color:var(--teal)}
.mscrim{position:fixed;inset:0;background:rgba(18,38,58,.4);z-index:60;display:grid;place-items:center;padding:20px}
.mscrim[hidden]{display:none!important}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:4px;box-shadow:0 20px 60px rgba(18,38,58,.3);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal-h{padding:16px 20px 12px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:flex-start}
.modal-h h2{font-size:17px}
.modal-b{padding:16px 20px;display:grid;gap:14px}
.modal-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line-2);align-items:center}
.sim-note{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin-right:auto}

/* ---------- report ---------- */
.rscrim{position:fixed;inset:0;background:#d6dde2;z-index:55;display:flex;flex-direction:column}
.rscrim[hidden]{display:none!important}
.r-bar{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.r-scroll{flex:1;overflow:auto;padding:24px 16px 60px}
.sheet{width:min(820px,100%);margin:0 auto;background:#fff;box-shadow:0 2px 0 #c3ccd3,0 10px 30px rgba(18,38,58,.12);padding:44px 52px 50px;font-size:13px;line-height:1.55}
.sheet h1{font-size:22px;letter-spacing:-.01em}
.sheet h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:24px 0 8px;padding-bottom:5px;border-bottom:1.5px solid var(--ink);display:flex;gap:8px}
.sheet h2 span{color:var(--ink-3);font-family:var(--mono);font-weight:500}
.sheet table{width:100%;border-collapse:collapse;font-size:12.5px}
.sheet th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:5px 6px;border-bottom:1px solid var(--line)}
.sheet td{padding:6px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.sheet ul{margin:4px 0;padding-left:18px}
.sheet li{margin:3px 0}
.inc-banner{margin:14px 0 6px;border:2px solid var(--amber);color:var(--amber);background:var(--amber-soft);padding:9px 12px;border-radius:4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;display:flex;gap:8px;align-items:center}
.inc-banner span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kv div{border:1px solid var(--line-2);border-radius:4px;padding:6px 8px}
.kv dt{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.kv dd{margin:0;font-weight:600}
.disclaim{margin-top:24px;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);padding:10px 12px;border-radius:4px;background:var(--surface-2)}
@media print{.top,.r-bar,.view{display:none!important}.rscrim{position:static;background:#fff}.r-scroll{overflow:visible;padding:0}.sheet{box-shadow:none;padding:0}}

/* ---------- pages ---------- */
.page{flex:1;overflow:auto;padding:20px 24px 40px}
.page-in{max-width:1180px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:22px;letter-spacing:-.01em}
.page-h p{color:var(--ink-2);margin-top:3px;max-width:70ch}
.policy-banner{display:flex;gap:10px;align-items:flex-start;border:1px dashed #8fa1b2;background:#fafbfc;border-radius:4px;padding:11px 14px;font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 12px;font-size:13px;display:flex;gap:7px;align-items:center}
.tabs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.rule{background:#fff;border:1px solid var(--line);border-radius:4px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.rule-l{padding:14px 16px;border-right:1px solid var(--line-2)}
.rule-r{padding:14px 16px}
.rule-id{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.rule h3{font-size:14.5px;margin:2px 0 6px}
.rule-param{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:10px;flex-wrap:wrap}
.rule-param input[type=number]{width:72px;height:30px;border:1px solid var(--line);border-radius:4px;padding:0 8px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer}
.toggle input{accent-color:var(--teal);width:15px;height:15px}
.trig{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:12.5px}
.trig li{display:flex;gap:7px}
.trig li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-top:7px;flex:none}
.outcome-sum{display:flex;gap:8px;flex-wrap:wrap}
.act-list{background:#fff;border:1px solid var(--line);border-radius:4px}
.act{display:grid;grid-template-columns:150px 30px minmax(0,1fr);gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:start}
.act:last-child{border-bottom:0}
.act .when{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:3px}
.act .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gray-soft);color:var(--ink-2)}
.act.new{background:#f5fbfa}
.act-text{font-size:13.5px}
.act-sub{font-size:12px;color:var(--ink-3);margin-top:2px}

/* new review */
.nr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.drop{border:1.5px dashed #a9b7c2;border-radius:4px;padding:22px;text-align:center;background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.up-list{display:grid;gap:6px;margin-top:12px}
.up{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line-2);border-radius:4px;background:#fff;font-size:12.5px}
.up b{font-family:var(--mono);font-weight:500;font-size:12px;word-break:break-all}
.proc-st{font-size:11.5px;font-weight:600;display:flex;gap:5px;align-items:center;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 4px;border-bottom:1px solid var(--line-2)}
.step:last-child{border-bottom:0}
.step .b{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);background:#fff}
.step.run .b{border-color:var(--teal);color:var(--teal);animation:pulse 1s infinite}
.step.done .b{background:var(--teal);border-color:var(--teal);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--teal-soft)}}
.step h4{font-size:13.5px}
.step p{font-size:12px;color:var(--ink-3);margin-top:1px}

/* toast, guide */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:13px;box-shadow:0 8px 24px rgba(18,38,58,.3);display:flex;gap:8px;align-items:center;max-width:560px}
.guide{position:absolute;top:50px;right:0;width:330px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 16px 40px rgba(18,38,58,.18);padding:14px;z-index:45}
.guide ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;counter-reset:g}
.guide li{display:flex;gap:9px;font-size:13px;padding:5px 4px;align-items:center;counter-increment:g}
.guide li .b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10.5px;color:var(--ink-3);flex:none}
.guide li .b::before{content:counter(g)}
.guide li.done{color:var(--ink-3)}
.guide li.done .b{background:var(--teal);border-color:var(--teal);color:#fff}
.guide li.done .b::before{content:"✓"}
.guide li{padding:0}
.guide li button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 6px;border-radius:4px;font-size:13px;color:inherit}
.guide li button:hover{background:var(--teal-soft)}
.guide li.cur button{background:var(--teal-soft);font-weight:600;color:var(--ink)}
.guide li.cur .b{border-color:var(--teal);color:var(--teal)}
.guide-f{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.dbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:80;width:min(820px,calc(100vw - 32px));background:var(--ink);color:#fff;border-radius:4px;box-shadow:0 12px 34px rgba(18,38,58,.35);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px}
.dbar .meta{flex:1;min-width:0}
.dbar .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#9fd8cf;font-weight:600;display:flex;gap:8px;align-items:center}
.dbar .t{font-weight:600;font-size:14px;margin-top:1px}
.dbar .h{font-size:12.5px;color:#c9d4de;margin-top:1px}
.dbar .dots{display:flex;gap:3px}
.dbar .dots i{width:14px;height:4px;border-radius:2px;background:#3c5266;display:block}
.dbar .dots i.on{background:#5ec4b6}.dbar .dots i.cur{background:#fff}
.dbar .btn{background:#1d3850;border-color:#2f4c66;color:#fff}
.dbar .btn:hover{background:#25445f;border-color:#3d5d7a}
.dbar .btn-primary{background:var(--teal);border-color:var(--teal)}
.dbar .btn-primary:hover{background:#3359ea}
.has-bar .app,.has-bar .drawer,.has-bar .rscrim{padding-bottom:92px}
.has-bar .mscrim{padding-bottom:110px}
.has-bar .drawer{background:var(--bg)}
.dbar-min{position:fixed;right:16px;bottom:16px;z-index:80}
.toasts{bottom:96px!important}
/* premium worksheet */
.prem{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.prem-main{overflow:auto;padding:16px 20px 40px}
.prem-side{overflow:auto;padding:16px 20px 40px 0;display:flex;flex-direction:column;gap:12px}
.ps-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px}
.ps-total{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.ps-lines{margin:12px 0;display:grid;gap:8px}
.pl{position:relative;display:flex;justify-content:space-between;font-size:13px;padding-bottom:6px}
.pl i{position:absolute;left:0;bottom:0;height:3px;border-radius:2px;background:var(--teal)}
.pl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--line-2);z-index:0}
.pl i{z-index:1}
.pl.off{color:var(--ink-3)}
.ps-itv{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.ps-warn{display:flex;gap:6px;font-size:12px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-line);border-radius:4px;padding:7px 9px;margin-top:6px}
.ps-ch{margin:0;padding-left:16px;font-size:12px;display:grid;gap:2px}
.ps-ver{padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.ps-ver:last-child{border-bottom:0}
.psec{background:#fff;border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
.psec.off .psec-b,.psec.off .formula{opacity:.45}
.psec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.psec-h h3{font-size:15px}
.psec-prem{display:flex;flex-direction:column;align-items:flex-end}
.psec-prem b{font-size:17px}
.psec-b{padding:12px 16px}
.formula{padding:9px 16px;background:var(--surface-2);border-top:1px solid var(--line-2);color:var(--ink-2);font-size:12px;overflow-x:auto;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
.pf{display:flex;flex-direction:column;gap:5px;min-width:0}
.pf label{font-size:12px;font-weight:600;color:var(--ink-2)}
.pf .hint{font-size:11.5px;color:var(--ink-3)}
.pf-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:#fff;overflow:hidden}
.pf-in span{padding:0 8px;color:var(--ink-3);font-size:13px;background:var(--surface-2);align-self:stretch;display:grid;place-items:center}
.pf-in input{border:0;height:34px;padding:0 8px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.pf-in input:focus{outline:none}
.pf-in:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.pf-rs{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:center}
.pf-wide{grid-column:span 2}
input[type=range]{accent-color:var(--teal);width:100%}
.fnum{height:30px;border:1px solid var(--line);border-radius:4px;padding:0 6px;width:100%;font-variant-numeric:tabular-nums;text-align:right}
.fhead{display:grid;grid-template-columns:minmax(0,1.6fr) 72px minmax(120px,1fr) 70px 78px 32px;gap:10px;margin-top:14px;padding:0 6px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fhead span:nth-child(3){grid-column:3 / span 2}
.fhead span:nth-child(4){display:none}
.frow{display:grid;grid-template-columns:minmax(0,1.6fr) 72px minmax(120px,1fr) 70px 78px 32px;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line-2);border-radius:4px}
.frow.ovr{background:#f3f8fc}
.fl-t{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.fl-f{font-size:12.5px;margin-top:1px}
.fl-s{font-size:11.5px;color:var(--ink-3)}
.warnt{color:var(--amber)}
.ovr-tag{display:none;font-size:10.5px;font-weight:600;color:var(--slate);background:var(--slate-soft);border:1px solid var(--slate-line);border-radius:4px;padding:0 5px}
.frow.ovr .ovr-tag{display:inline-block}
.fsug{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column}
.fsug b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.rwrap{position:relative;padding-bottom:16px;min-width:0}
.rwrap input[type=range]{display:block;margin:4px 0 0}
.rtick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;pointer-events:none;color:var(--teal-hover)}
.rtick i{display:block;width:2px;height:22px;background:var(--ink);opacity:.5;border-radius:1px}
.rtick span{pointer-events:auto;cursor:pointer;font-size:10px;font-weight:600;white-space:nowrap;line-height:1.2;padding:0 4px;border-radius:3px;background:var(--teal-soft);border:1px solid var(--teal-line)}
.rtick span:hover{background:#cfe9e4}
.rtick:focus-visible span{outline:2px solid var(--teal);outline-offset:1px}
.rtick.at span{background:transparent;border-color:transparent;color:var(--ink-3);font-weight:500}
.rtick.at i{opacity:.25}
.fimp{font-size:12.5px;text-align:right;color:var(--ink-2)}
.freset{padding:0 6px}
@media (max-width:1000px){.prem{grid-template-columns:1fr;overflow:auto;display:block}.prem-main,.prem-side{overflow:visible;padding:16px}.frow,.fhead{grid-template-columns:1fr 1fr}.fhead{display:none}.pf-wide{grid-column:auto}}
/* compliance */
.cmp-tabs{flex:none;display:flex;gap:4px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.cmp-tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.cmp-tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;border-top:3px solid var(--line)}
.bcard b{font-size:26px;font-weight:600;line-height:1.1}
.bcard .bl{font-size:12.5px;font-weight:600}
.bcard .bs{font-size:10.5px;color:var(--ink-3);line-height:1.35}
.bcard.on{box-shadow:0 0 0 2px var(--teal);border-color:var(--teal)}
.b-missing,.b-noncompliant{border-top-color:var(--red)!important}.b-unable,.b-noresults{border-top-color:#9aa5b0!important}.b-expiring{border-top-color:#d39b3a!important}.b-pendingLpi,.b-lpi{border-top-color:var(--slate)!important}.b-compliant{border-top-color:var(--green)!important}
.bnote{margin:8px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
.cpill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;border:1px solid;white-space:nowrap;font-family:var(--mono)}
.cs-r{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}.cs-a{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.cs-g{color:var(--gray);border-color:#c7ced5;background-color:#f0f2f3;background-image:repeating-linear-gradient(45deg,rgba(150,160,170,.25) 0 1.5px,transparent 1.5px 5px)}
.cs-s{color:var(--slate);background:var(--slate-soft);border-color:var(--slate-line)}.cs-p{color:#5b4a8a;background:#efecf7;border-color:#d4cdea}
.cs-ok{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}.cs-n{color:var(--gray);background:var(--gray-soft);border-color:#d3d9de}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;border:1px solid var(--line);margin:1px 4px 1px 0;background:#fff;color:var(--ink-2);white-space:nowrap}
.t-fp{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}.t-out{color:var(--slate);border-color:var(--slate-line);background:var(--slate-soft)}
.t-system{color:var(--ink-2)}.t-manual{color:#5b4a8a;border-color:#d4cdea;background:#efecf7}.t-import{color:var(--teal-hover);border-color:var(--teal-line);background:var(--teal-soft)}
.coll-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cchip{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--surface-2)}
.cchip.rel{text-decoration:line-through;color:var(--ink-3)}.cchip.ph{border-style:dashed;color:var(--ink-3)}
.src{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:0 4px;margin-left:4px}
.src-app{background:var(--gray-soft);color:var(--gray)}.src-lender{background:var(--teal-soft);color:var(--teal-hover)}.src-investor{background:#efecf7;color:#5b4a8a}
td.grp{background:var(--surface-2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.reqrow{border-top:1px solid var(--line-2);padding:8px 0}
.cmp-set{grid-template-columns:minmax(0,1fr) 360px}
select.cset{max-width:170px}
#cmInv{max-width:190px}
@media (max-width:1000px){.cmp-grid{grid-template-columns:1fr}}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}

@media (max-width:1000px){
  .top{gap:12px;height:auto;min-height:56px;flex-wrap:wrap;padding:8px 16px}
  .nav{height:40px;overflow-x:auto}
  .user span{display:none}
  .port{grid-template-columns:1fr;grid-template-rows:520px auto}
  .queue{border-left:0;border-top:1px solid var(--line)}
  .ws{grid-template-columns:1fr;overflow:auto;display:block}
  .ws .col{overflow:visible}
  .col-m .map{height:460px;flex:none}
  .ex-grid,.nr,.form-grid,.rule{grid-template-columns:1fr}
  .rule-l{border-right:0;border-bottom:1px solid var(--line-2)}
  .legend{width:240px}
  .agg,.zoom-note{display:none}
  .sheet{padding:24px 18px}
  .kv{grid-template-columns:1fr 1fr}
  .act{grid-template-columns:1fr;gap:4px}
  .act .dot{display:none}
  html,body{height:auto}
  .app{height:auto;min-height:100vh;min-height:100dvh}
  .top{position:sticky;top:0}
  .nav{order:3;flex:1 1 100%;min-width:0}
  .top-right{min-width:0;flex-wrap:wrap;gap:8px}
  .view{flex:none}
  .port{grid-template-rows:min(520px,70vh) auto}
  .queue-list{overflow:visible}
  .ws,.prem{overflow:visible}
  .col-m .map{height:min(460px,70vh)}
}
@media (min-width:1001px) and (max-width:1560px){
  .top{height:auto;min-height:56px;flex-wrap:wrap;row-gap:0}
  .nav{height:52px}
  .top-right{padding:0 0 8px}
}
@media (max-width:700px){
  .top{padding:8px 12px;position:static}
  .demo-tag{font-size:11px;padding:3px 7px}
  .toolbar,.ws-head{padding:10px 12px}
  .search{width:100%}
  .dbar{flex-wrap:wrap;gap:8px;bottom:8px;width:calc(100vw - 16px);padding:10px 12px}
  .dbar .meta{flex:1 1 100%}
  .has-bar .app,.has-bar .drawer,.has-bar .rscrim{padding-bottom:170px}
  .toasts{bottom:176px!important;width:calc(100vw - 24px)}
  .map-bottom{flex-direction:column-reverse;align-items:stretch;gap:6px}
  .map-bottom>.legend,.map-bottom>.scale-chip,#map-workspace .legend,#map-workspace .scale-chip{width:auto;max-width:none}
  .loc-chip{top:96px;max-width:calc(100% - 70px)}
  .layer-ctl label{padding:3px 8px}
  .qi-actions{flex-wrap:wrap}
  .ws-head .btn{white-space:normal;height:auto;min-height:34px;padding:6px 12px;text-align:left;max-width:100%}
  .ws-head .spacer{display:none}
}

/* decision-critical gap ranking */
.gap{border:1px solid var(--teal-line);background:var(--teal-soft);border-radius:4px;padding:10px 12px;margin:8px 0 12px}
.gap-h{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.gap-h b{font-size:14px}
.gap-row{display:grid;grid-template-columns:22px minmax(0,1fr) 96px;gap:8px;align-items:start;padding:7px 0;border-top:1px solid rgba(36,71,213,.18)}
.gap-row:not(.ask){opacity:.72}
.gap-n{width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--teal-line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.gap-row.ask .gap-n{background:var(--teal);border-color:var(--teal);color:#fff}
.gap-t b{font-size:13px}
.gap-v{text-align:right;font-size:13px}
.gap-bar{height:4px;background:rgba(36,71,213,.15);border-radius:2px;margin-top:4px}
.gap-bar i{display:block;height:100%;background:var(--teal);border-radius:2px}
.gap-f{margin:8px 0 0;padding-top:8px;border-top:1px solid rgba(36,71,213,.18)}
.gap-cut{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:6px 0 2px;border-top:1px dashed rgba(36,71,213,.35)}
.age.old{color:var(--amber);font-weight:500}
@media print{.gap .btn{display:none}}

/* address matching (real county records) */
.real-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--teal-hover);background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:4px;padding:2px 7px}
.mt-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:14px;align-items:start}
.mt-form{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}
.mt-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:8px}
.mt-kv dt{color:var(--ink-3)}.mt-kv dd{margin:0}
.mt-note{font-size:12.5px;color:var(--ink-2);margin:6px 0 0;padding-left:16px}
.bcard.pass{border-top-color:var(--green)!important}.bcard.warn{border-top-color:#d39b3a!important}.bcard.base{border-top-color:#9aa5b0!important}
.mt-tbl td{vertical-align:top}
.mt-tbl tbody tr{cursor:pointer}
@media (max-width:1000px){.mt-grid{grid-template-columns:1fr}.mt-form{grid-template-columns:1fr}}

/* document extraction results */
.xr{margin-top:14px}
.xr-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.xr-tbl td{vertical-align:top}
.xr-tbl tr.unk td{background-color:#f6f7f8;background-image:repeating-linear-gradient(45deg,rgba(150,160,170,.16) 0 1.5px,transparent 1.5px 6px);color:var(--ink-3)}
.xr-tbl td.grp{cursor:default}
.xr-v{font-weight:600}
.xr-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.xr-grid>*{min-width:0}
.xr .doc b,.xr .doc span{overflow-wrap:anywhere}
.ctx{font-family:var(--serif);font-size:14px;line-height:1.6}
.ctx div{padding:1px 0;white-space:pre-wrap}.ctx .hit{background:#fff8d6}
@media (max-width:1000px){.xr-grid{grid-template-columns:1fr}}

/* risk model */
.rm{--p-flood:#2a78d6;--p-fire:#eb6834;--p-water:#1baf7a;--p-wildfire:#eda100;--p-eq:#e87ba4;--viz:#2a78d6;--viz-soft:rgba(42,120,214,.13);--grid:#e4e9ed;--axis:#8a96a2}
.rm-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rm-tile{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.rm-tile .l{font-size:12px;color:var(--ink-2);font-weight:600}
.rm-tile b{display:block;font-size:24px;font-weight:600;line-height:1.15;margin-top:2px}
.rm-tile .s{font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.rm-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:14px}
.rm-2>*{min-width:0}
.rm-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.rm-card h3{font-size:14px;margin-bottom:2px}
.rm-card .sub{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.rm svg:not(.ic){display:block;width:100%;height:auto;overflow:visible}
.rm svg:not(.ic) text{font-family:var(--font);fill:var(--ink-2);font-size:11px}
.rm svg .ax{fill:var(--ink-3);font-size:10.5px}
.rm svg .lab{fill:var(--ink);font-weight:600}
.rm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.rm-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.rm-legend i.band{height:10px;border-radius:2px}
/* the model, row by row */
.mflow{display:grid;grid-template-columns:118px minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1.05fr);gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.mflow>div{padding:9px 10px;border-top:1px solid var(--line-2);font-size:12.5px;min-width:0;position:relative}
.mflow>.mh{border-top:0;background:var(--surface-2);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.mflow>.mh small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:11px;margin-top:1px}
.mflow .arrow::before{content:'';position:absolute;left:-1px;top:50%;width:9px;height:9px;border-top:1.5px solid #9fb0bd;border-right:1.5px solid #9fb0bd;transform:translate(-55%,-50%) rotate(45deg);background:#fff}
.mflow .pn{display:flex;align-items:center;gap:7px;font-weight:600}
.mflow .pn i{width:10px;height:10px;border-radius:3px;flex:none}
.mflow .big{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:1px 3px 2px 0;background:#fff;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mchip.m-missing{border-style:dashed;color:var(--gray);background-color:#f3f4f5}
.mchip.m-estimated,.mchip.m-conflicting{border-color:var(--amber-line);background:var(--amber-soft);color:var(--amber)}
.mchip.m-sourced{border-color:var(--teal-line);background:var(--teal-soft);color:var(--teal-hover)}
.mbar{height:8px;border-radius:4px;margin-top:5px;min-width:3px}
.mflow .tot{background:var(--surface-2);font-weight:600}
.rm-eq{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;line-height:1.7;margin-top:10px;overflow:auto;white-space:nowrap}
.drv{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.drv:first-of-type{border-top:0}
.drv .tr{height:8px;background:var(--line-2);border-radius:4px}.drv .tr i{display:block;height:100%;border-radius:4px;background:var(--viz)}
.lim{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.lim:first-of-type{border-top:0}
.lim .tr{height:8px;background:var(--line-2);border-radius:4px;position:relative;margin-top:6px}
.lim .tr i{display:block;height:100%;border-radius:4px;background:var(--green)}.lim.over .tr i{background:var(--red)}
.lim .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:66.66%}
.lim input{width:100%}
@media (max-width:1000px){.rm-2{grid-template-columns:1fr}.mflow{grid-template-columns:1fr 1fr}.mflow>.mh{display:none}.mflow .arrow::before{display:none}.mflow>.pc{grid-column:1/-1;background:var(--surface-2)}}

/* risk card in the workspace, before/after view, answer simulation */
.rk{border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin:0 0 14px;background:linear-gradient(180deg,#f7fbfa,#fff 60%)}
.rk-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rk-big{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.rk-big span{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:4px}
.rk-conf{text-align:right;font-weight:600;font-size:15px;border-radius:4px;padding:5px 10px;border:1px solid;white-space:nowrap}
.rk-conf span{display:block;font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.rk-Narrow{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.rk-Moderate{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.rk-Wide{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.rk-track{position:relative;height:30px;margin:12px 0 2px}
.rk-track .axis{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.rk-track .was{position:absolute;top:8px;height:14px;border:1.5px dashed #9aa5b0;border-radius:4px}
.rk-track .now{position:absolute;top:8px;height:14px;border-radius:4px;background:rgba(36,71,213,.22);border:1.5px solid var(--teal);transition:left .6s ease,width .6s ease}
.rk-track .pt{position:absolute;top:4px;width:3px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-1px);transition:left .6s ease}
.rk-ends{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.rk-stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.rk-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.rk-ask{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2);font-size:13px}
.rk-ask .n{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.rk-done{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--green-line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:2px 4px 2px 9px;margin:2px 4px 2px 0}
.rk-done button{border:0;background:none;color:inherit;padding:0 4px;font-size:14px;line-height:1}
.ba{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.ba button{border:0;background:none;padding:0 12px;height:34px;font-weight:600;font-size:13px;color:var(--ink-2)}
.ba button.on{background:var(--ink);color:#fff}
.ws.legacy .col-l .chip,.ws.legacy .fact-meta,.ws.legacy .fact-note,.ws.legacy .col-l .sec:nth-child(2),.ws.legacy .col-l .sec:last-child{display:none}
.ws.legacy .col-l .fact{pointer-events:none}
.lg{font-family:var(--mono)}
.lg-price{font-size:34px;font-weight:600;font-family:var(--font);font-variant-numeric:tabular-nums}
.lg-box{border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--surface-2);margin-top:10px;font-size:12.5px;line-height:1.6}
.lg-cant{border:1px dashed var(--amber-line);background:var(--amber-soft);color:var(--amber);border-radius:4px;padding:10px 12px;margin-top:12px;font-size:13px}
.lg-cant li{margin:2px 0}
.qi-model{margin-top:6px;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qi-model b{color:var(--ink);font-variant-numeric:tabular-nums}
.res-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:9px 11px;cursor:pointer}
.res-opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.res-opt input{margin-top:3px;accent-color:var(--teal)}

/* ============ v2 interface: side navigation, decision-first workspace, cards-first desk ============ */
:root{--bg:#eef0f4;--surface:#ffffff;--surface-2:#f5f6f9;--ink:#0d1626;--ink-2:#39475e;--ink-3:#65728a;--line:#d2d8e2;--line-2:#e5e9f0;
 --teal:#2447d5;--teal-hover:#1a36ab;--teal-soft:#e8ecfd;--teal-line:#b5c3f6;
 --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--display:'Space Grotesk','Inter',system-ui,sans-serif}
h1,h2,.brand,.rk-big,.rm-tile b,.bcard b,.ps-total,.kpi b,.lg-price,.page-h h1{font-family:var(--display);letter-spacing:-.015em}
.eyebrow{letter-spacing:.09em}
.btn{font-weight:600}
.app{flex-direction:row}
.side{flex:none;width:226px;background:var(--ink);color:#c7d0df;display:flex;flex-direction:column;padding:16px 12px 14px;overflow:auto}
.side .brand{color:#fff;font-size:17px;padding:2px 8px 12px}
.side .brand svg{color:#93a8ff}
.side h6{margin:16px 10px 5px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#7786a0;font-weight:600}
.ni{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:inherit;padding:8px 10px;border-radius:4px;font-weight:500;font-size:13.5px;text-align:left;white-space:nowrap}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.on{background:var(--teal);color:#fff}
.ni .count{margin-left:auto;font-size:11px;background:#f6c667;color:#3b2a00;border-radius:9px;padding:0 6px;font-weight:700}
.ni:focus-visible{outline-color:#fff}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.13)}
.side .demo-tag{background:none;background-image:none;border-color:rgba(255,255,255,.32);color:#c7d0df;white-space:normal;line-height:1.3}
.side .user{color:#c7d0df}.side .avatar{background:#26344d;color:#dfe6f3}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.bar{flex:none;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.bar .where{font-family:var(--display);font-weight:600;font-size:15px}
.bar .where small{font-family:var(--font);font-weight:500;color:var(--ink-3);font-size:12px;margin-right:8px;letter-spacing:.08em;text-transform:uppercase}
/* desk: KPI strip, submission cards first, map second */
.kpis{flex:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border-bottom:1px solid var(--line)}
.kpi{background:var(--surface);padding:12px 20px;box-shadow:1px 0 0 var(--line-2),0 1px 0 var(--line-2)}
.kpi .l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi b{display:block;font-size:25px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}
.port{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.queue{order:-1;border-left:0;border-right:1px solid var(--line);background:var(--bg)}
.queue-h{background:var(--surface)}
.queue-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;padding:14px 16px}
.qi{margin:0;padding:14px 14px 12px;border-color:var(--line);border-left:4px solid var(--line)}
.qi.on{border-left-color:var(--teal)}
.qi-name{font-family:var(--display);font-size:15px}
.qi-range{margin-top:10px}
.qi-actions{flex-wrap:wrap}
.side{position:relative;z-index:31}
.qi-range .trk{position:relative;height:10px;background:var(--line-2);border-radius:5px}
.qi-range .trk i{position:absolute;top:0;bottom:0;border-radius:5px;background:rgba(36,71,213,.28);border:1.5px solid var(--teal)}
.qi-range .trk u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.qi-range .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:5px;font-variant-numeric:tabular-nums}
.qi-range .ends b{color:var(--ink)}
/* workspace: decision on the left, evidence in tabs on the right */
.ws.ws2{grid-template-columns:minmax(390px,5fr) 7fr}
.ws2 .col-r{border-left:0;border-right:1px solid var(--line)}
.evi{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.evi-tabs{flex:none;display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.evi-tabs button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:11px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.evi-tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.evi-body{flex:1;min-height:0;overflow:auto}
.evi-body.facts{padding:16px}
.ws2 .col-l{background:none;border:0;padding:0;columns:2 300px;column-gap:14px}
.ws2 .col-l .sec{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin:0 0 14px}
.evi-body.mapwrap{position:relative;overflow:hidden}
.evi-body.mapwrap .map{position:absolute;inset:0}
.rk{background:var(--surface);border-color:var(--line);border-top:3px solid var(--teal)}
.policy-banner,.card,.rm-card,.rm-tile,.bcard,.ps-card{border-radius:4px}
@media (max-width:1000px){
  .app{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:2px;overflow-x:auto}
  .side h6,.side-foot{display:none}
  .side .brand{padding:2px 12px 2px 4px}
  .ni{width:auto}
  .port{grid-template-columns:1fr;grid-template-rows:auto min(420px,60vh)}
  .queue{border-right:0}
  .ws.ws2{display:block}
  .evi-body{overflow:visible}
  .evi-body.mapwrap{height:min(460px,70vh)}
  .ws2 .col-l{columns:1}
}
@media (max-width:700px){.bar{padding:6px 12px;flex-wrap:wrap}.kpi{padding:10px 12px}.kpi b{font-size:20px}.queue-list{grid-template-columns:1fr;padding:12px}}

<script>
/* Property Risk Lens · submission document extractor
   Reads the text layer of submission PDFs and fills a property profile. Every populated field keeps the
   document, page and line it came from; a field with no supporting line stays "unknown". Nothing is inferred.

   Works in the browser (with pdf.js supplying page text) and in Node (given page lines directly). */

  const v=(cx/1000)*0.55+(1-cy/640)*0.6+(h-0.5)*0.18;
  const cls=v<0.4?0:v<0.55?1:v<0.7?2:v<0.85?3:4;
  return {cx,cy,cls};
}

    out.r1={o:ok?'satisfied':'needs',facts:[`Replacement-cost estimate ${usd(r.rc.v)} dated ${fD(r.rc.date)} (${r.rc.src})`,`Age on review date (Oct 8, 2026): ${age} months`,`Policy limit: ${R.r1.months} months`].concat(req?[`Request ${req.id} awaiting response · follow-up ${fD(new Date(req.due+'T12:00'))}`]:[]),
      text:ok?'Replacement-cost evidence falls within the configured window.':'The only replacement-cost evidence on file is older than the configured window. Current evidence is needed.'};
  }
  // R2
  if(!R.r2.on) out.r2={o:'na',facts:[],text:'Rule turned off for this demo policy.'};
  else{
    const ratio=r.limit.v/r.rc.v*100, ok=ratio>=R.r2.pct;
    let o=ok?'satisfied':'exception';
    if(!ok&&p.status==='referred') o='referred';
    const f=[`Building limit ${usd(r.limit.v)} (${r.limit.src})`,`Replacement-cost estimate ${usd(r.rc.v)} (${r.rc.src})`,`Limit equals ${ratio.toFixed(1)}% of replacement cost; policy asks for at least ${R.r2.pct}%`];
    if(!ok) f.push(`Potential shortfall: ${usd(r.rc.v-r.limit.v)}`);
    if(R.r1.on&&age>R.r1.months) f.push('Replacement-cost figure itself is outside the freshness window, so this comparison is provisional');
    out.r2={o,facts:f,text:(ok?'Building limit meets the configured share of replacement cost.':'Building limit is below the configured share of replacement cost.')+' Market value is not used in this comparison.'+(o==='referred'?' Referred to manager with other open issues.':'')};
  }
  // R3
  if(!R.r3.on) out.r3={o:'na',facts:[],text:'Rule turned off for this demo policy.'};
  else if(p.id==='oak') out.r3={o:'needs',facts:['Annual tax $24,000 and installments sourced from FY 2026–27 tax bill (Sep 15, 2026)','Next installment $12,000 due Nov 1, 2026: upcoming, not delinquent','Outstanding balance and lien status not confirmed; simulated lien search returned no records'],text:'Amounts and dates are sourced. Outstanding balance and lien status still need evidence; a search with no results does not establish absence of a lien.'};

function simulateRequest(){
  const p=byId(S.ws);
  const q=makeRequest(p,{subject:{pace:'PACE payoff statement and program terms',retro:'seismic retrofit compliance evidence',top:'top-ranked follow-up questions'}[S.reqKind],msg:$('#rqMsg').value.trim(),role:$('#rqRole').value,owner:$('#rqOwner').value,due:$('#rqDue').value||'2026-10-22'});
  if(p.id==='oak'&&!S.reqKind)done('request');
  closeModal();closeDrawer();render();toast(`${q.id} marked “Awaiting response”. No message was sent.`,'send');
}
function makeRequest(p,o){
  const n=String(Math.max(306,...S.requests.map(r=>+r.id.slice(4)||0))+1).padStart(4,'0');
  const q={id:'REQ-'+n,prop:p.id,msg:o.msg,role:o.role,owner:o.owner,due:o.due,status:'Awaiting response',created:fT(S.clock)};
  S.requests.push(q);
  if(p.status!=='referred'&&p.status!=='reviewed') p.status='awaiting';
  if(p.status==='awaiting') p.next=`Awaiting ${q.role.toLowerCase()} response · follow-up ${fD(new Date(q.due+'T12:00')).replace(', 2026','')}`;
  log(p.id,`Simulated request ${q.id} to ${q.role.toLowerCase()}: ${o.subject||'replacement-cost evidence and insured building area'}. Owner ${q.owner}. Follow-up ${fD(new Date(q.due+'T12:00'))}.`,'send');
  return q;
}

  const p=byId(S.ws);

function doRefer(){
  const p=byId(S.ws),reason=$('#rfReason').value.trim();
  referProp(p,reason);
  if(p.id==='oak')done('refer');
  closeDrawer();
  if(!$('#reportScrim').hidden) openReport(true);
  render();
  showReferred(p);
}
function referProp(p,reason){
  p.status='referred';p.statusDetail='Referred—open issues remain';p.next='Manager decision pending · Dana Whitfield';p.referReason=reason;
  log(p.id,`Referred to manager (Dana Whitfield): ${reason}`,'refer');
}
function showReferred(p){
  openModal(`<div class="modal-h"><div style="flex:1"><div class="eyebrow">${p.name} · ${p.caseId}</div><h2>Referred to manager</h2></div></div>

let pdfReady=null;
function loadPdfJs(){
  return pdfReady||(pdfReady=new Promise((res,rej)=>{
    if(window.pdfjsLib){res();return}
    const lib=document.getElementById('plPdfSrc'),wk=document.getElementById('plPdfWorkerSrc');
    if(lib&&wk){try{(0,eval)(lib.textContent);window.pdfjsLib=window.pdfjsLib||globalThis['pdfjs-dist/build/pdf'];pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([wk.textContent],{type:'text/javascript'}));res()}catch(e){pdfReady=null;rej(new Error('The embedded PDF reader could not start: '+e.message))}return}
    const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res()};
    sc.onerror=()=>{pdfReady=null;rej(new Error('The PDF reader (pdf.js) could not be loaded from the CDN. Check the network connection and try again.'))};
    document.head.appendChild(sc)}));
}
async function readPdfFile(f){
  const data=f.b64?Uint8Array.from(atob(f.b64),c=>c.charCodeAt(0)):new Uint8Array(await f.file.arrayBuffer());
  const pdf=await pdfjsLib.getDocument({data}).promise,pages=[];
  for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),tc=await pg.getTextContent();pages.push({n,lines:PLExtract.linesFromItems(tc.items)})}
  return {name:f.name,pages};
}
async function runBuild(){
  const N=S.nr;if(N.running||!N.files.length)return;
  N.msg='';N.running=true;N.step=0;N.result=null;N.match=null;N.files.forEach(f=>{f.status='Queued';f.fields=null});render();
  const t0=performance.now(),docs=[];
  try{
    await loadPdfJs();
    for(const f of N.files){f.status='Reading';render();
      try{const d=await readPdfFile(f);docs.push(d);f.status='Extracted';f.lines=d.pages.reduce((a,p)=>a+p.lines.length,0)}
      catch(e){f.status='Could not read';f.err=e.message}
      render()}
    if(!docs.length)throw new Error('None of the files could be read as a PDF.');
    N.step=1;render();await new Promise(r=>setTimeout(r,60));
    const R=PLExtract.extract(docs);
    R.docs.forEach(d=>{const f=N.files.find(x=>x.name===d.name);if(f){f.type=d.typeLabel;f.fields=R.fields.filter(x=>x.sources.some(q=>q.doc===d.name)).length}});
    N.step=2;render();await new Promise(r=>setTimeout(r,60));
    N.step=3;render();await new Promise(r=>setTimeout(r,60));
    N.step=STEPS.length;N.docs=docs;N.result=R;N.ms=Math.round(performance.now()-t0);N.sample=N.files.every(f=>f.sample);
    if(N.sample)log('oak',`Property profile extracted from ${docs.length} sample documents: ${R.summary.populated} of ${R.summary.total} fields populated, ${R.summary.conflicts} conflict${R.summary.conflicts===1?'':'s'}.`,'db','System');
    toast(`Profile built from ${docs.length} document${docs.length===1?'':'s'} in ${(N.ms/1000).toFixed(1)} s.`,'check');
  }catch(e){N.msg=esc(e.message);N.step=-1}
  N.running=false;render();
  const el=$('#xr');if(el&&N.result)el.scrollIntoView({block:'start',behavior:'smooth'});
}
const xrField=(R,k)=>R.fields.find(f=>f.key===k);
function nrChecks(R){
  const out=[],rc=xrField(R,'replacementCost'),lim=xrField(R,'buildingLimit'),per=xrField(R,'policyPeriod');
  if(rc.norm&&lim.norm){const pct=lim.norm/rc.norm*100;out.push({bad:pct<100,t:`Building limit ${lim.value} is ${pct.toFixed(1)}% of the replacement-cost figure ${rc.value}${pct<100?`, a difference of ${usd(rc.norm-lim.norm)}`:''}.`})}
  else out.push({unk:true,t:`Limit against replacement cost cannot be checked: ${[!lim.norm&&'building limit',!rc.norm&&'replacement cost'].filter(Boolean).join(' and ')} not found.`});
  if(rc.norm&&rc.sources[0].date){const m=monthsBetween(new Date(rc.sources[0].date+'T12:00'),TODAY);out.push({bad:m>12,t:`Replacement-cost figure is dated ${rc.sources[0].date}, ${m} months before the review date (${fD(TODAY)}).`})}
  if(per.norm){const end=per.norm.split('/')[1],d=Math.round((new Date(end+'T12:00')-TODAY)/864e5);out.push({bad:d<=30,t:d<0?`Policy period ended ${end}, ${-d} days before the review date.`:`Policy period runs to ${end}, ${d} days after the review date.`})}
  R.fields.filter(f=>f.status==='conflicting').forEach(f=>out.push({bad:true,t:`${f.label} differs between documents: ${f.sources.map(x=>`${x.value} (${x.doc.replace(/\.pdf$/i,'')} p.${x.page})`).join(' vs ')}${f.diff?`, ${f.diff.toFixed(1)}% apart`:''}.`}));
  return out;
}

function nrMatch(){

const GAPQ={

 prot:{q:'Public protection class, distance to fire station and hydrant',who:'Insurance broker',r:[0.90,1.10]},
 spr:{q:'Sprinkler and alarm documentation',who:'Property manager',r:[0.85,1.00]},
 mit:{q:'Wildfire mitigation inspection (defensible space, vents, roof class)',who:'Property manager',r:[0.85,1.15]},

 roof:{q:'Roof age and last replacement (permit or invoice)',who:'Property manager',r:[0.92,1.20]},
 ret:{q:'Seismic retrofit screening form or compliance certificate',who:'Borrower',r:[0.85,1.25],rule:'r6'},

function premWith(p,over){

    const cur=+w.f[x.k],a=Math.min(g.r[0],cur),b=Math.max(g.r[1],cur);

    items.push({k:'rc',label:`Current replacement cost`,fact:`Estimate is ${age} months old`,st:'estimated',q:'Updated replacement-cost assessment dated within the policy window',who:'Appraiser',rule:S.rules.r1.on||S.rules.r2.on?'r1 and r2':null,swing:premWith(p,{limit:w.limit*up})-premWith(p,{limit:w.limit*0.95})});

  }

  items.forEach(x=>{if(n<3&&(n===0||cum<tot*0.6)&&x.swing>0){x.ask=true;n++}cum+=x.swing});

  return {items,base,tot,asks:items.filter(x=>x.ask),rest:items.filter(x=>!x.ask),
    lo:premWith(p,{f:lo.f,limit:w.limit*lm}),hi:premWith(p,{f:hi.f,limit:w.limit*hm}),sourced:src,inputs:all.length};
}

function cmpSetLabel(k){for(const [,items] of CE.META)for(const it of items)if(it[0]===k)return it[1];return k}
function cmpFmt(k,v){const m=CE.META.flatMap(g=>g[1]).find(x=>x[0]===k);if(!m)return String(v);if(v==null)return '<span class="muted">unset</span>';if(m[2].startsWith('money'))return cm(v);if(m[2].startsWith('pct'))return v+'%';if(m[2]==='bool')return v?'Yes':'No';return String(v)}
function cmpInput(k,type,opts,val,scope){

function cmpBindSettings(){

function plExpand(c){
  const b=x=>parseInt(x,36),idx={meta:c.meta,streets:c.S,addr:{},ranges:{},recs:{}};
  for(const sk in c.A)c.A[sk].split(';').forEach(e=>{const [n,p,z,la,lo]=e.split(','),[num,suf='']=n.split('.');
    const key=`${b(num)}|${suf}|${sk}`;(idx.addr[key]=idx.addr[key]||[]).push([c.P[b(p)],c.Z[b(z)],37.6+b(la)/1e5,-122.6+b(lo)/1e5])});
  for(const sk in c.R)idx.ranges[sk]=c.R[sk].split(';').map(e=>{const [f,d,par,p,src]=e.split(',');return [b(f),b(f)+b(d),par,c.P[b(p)],src]});
  c.C.forEach((r,i)=>{if(r===null)return;idx.recs[c.P[i]]=r===0?{use:'Single Family Residential',slim:true}:{use:c.U[r[0]],cls:r[1]?r[1].split('; '):[],yb:r[2]||null,st:r[3]||null,un:r[4]||null,ct:r[5]||null,ba:r[6]||null,la:r[7]||null,av:r[8]||null,nb:c.N[r[9]],situs:r[10],lots:r[11]}});
  return idx;
}
let PLM=null;
function mtState(){return S.mt||(S.mt={filter:'all',q:'',zip:'',res:null,loading:false,err:'',rerun:null})}
function mtLoad(cb){
  const M=mtState();if(PLM){cb();return}if(M.loading)return;
  M.loading=true;M.err='';render();
  const fin=()=>{setTimeout(()=>{try{PLM=PLMatcher.make(plExpand(window.PL_INDEX_COMPACT));window.PL_INDEX_COMPACT=null}catch(e){M.err='The parcel index could not be read: '+e.message}M.loading=false;if(PLM)cb();else render()},30)};
  if(window.PL_INDEX_COMPACT){fin();return}
  const emb=document.getElementById('plIndexSrc');
  if(emb){setTimeout(()=>{try{(0,eval)(emb.textContent)}catch(e){M.loading=false;M.err='The embedded parcel index could not be read: '+e.message;render();return}fin()},30);return}
  const sc=document.createElement('script');sc.src='parcel-index.js';sc.onload=fin;
  sc.onerror=()=>{M.loading=false;M.err='The parcel index file (parcel-index.js, 12 MB) was not found next to this page, so live matching is unavailable here. The benchmark results were computed offline and do not need it.';render()};
  document.head.appendChild(sc);
}
